<div class="row">
  <div class="col-12 mb-4">
    <div class="d-flex justify-content-between align-items-center">
      <h2>Gestión de Categorías</h2>
    </div>
  </div>

  <div *ngIf="mensaje" class="alert alert-success mb-4 text-dark fw-bold">{{ mensaje }}</div>
  
  <div *ngIf="erroresValidacion.length > 0" class="alert alert-danger mb-4 text-dark fw-bold">
    <ul class="mb-0 ps-3">
      <li *ngFor="let error of erroresValidacion">{{ error }}</li>
    </ul>
  </div>

  <div class="col-lg-4 mb-4">
    <div class="glass-card">
      <h4 class="mb-4">{{ editando ? 'Editar' : 'Nueva' }} Categoría</h4>
      <form (ngSubmit)="guardarCategoria()">
        <div class="mb-3">
          <label class="form-label text-muted small text-uppercase">Nombre</label>
          <input type="text" class="form-control" [(ngModel)]="categoriaActual.nombre" name="nombre" required>
        </div>
        <div class="mb-3">
          <label class="form-label text-muted small text-uppercase">Descripción</label>
          <textarea class="form-control" [(ngModel)]="categoriaActual.descripcion" name="descripcion" rows="3" required></textarea>
        </div>
        <div class="mb-4 form-check">
          <input type="checkbox" class="form-check-input" id="estadoCat" [(ngModel)]="categoriaActual.estado" name="estado">
          <label class="form-check-label" for="estadoCat">Categoría Activa</label>
        </div>
        
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary w-100">Guardar</button>
          <button type="button" class="btn btn-secondary w-100" *ngIf="editando" (click)="cancelarEdicion()">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <div class="col-lg-8">
    <div class="glass-card table-responsive">
      <h4 class="mb-4">Directorio de Categorías</h4>
      <table class="table table-dark table-hover table-borderless custom-table">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Estado</th>
            <th class="text-end">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let cat of categorias">
            <td class="fw-bold">{{ cat.nombre }}</td>
            <td><span class="text-truncate d-inline-block" style="max-width: 200px;">{{ cat.descripcion }}</span></td>
            <td>
              <span class="badge rounded-pill" [ngClass]="cat.estado ? 'bg-success text-white' : 'bg-danger text-white'">
                {{ cat.estado ? 'Activo' : 'Inactivo' }}
              </span>
            </td>
            <td class="text-end">
              <button class="btn btn-sm btn-outline-info me-2" (click)="seleccionarCategoria(cat)">
                <i class="bi bi-pencil-square"></i> Editar
              </button>
              <button class="btn btn-sm btn-outline-danger" (click)="eliminarCategoria(cat.idCategoria)">
                <i class="bi bi-trash"></i> Eliminar
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
